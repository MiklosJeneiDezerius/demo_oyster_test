dbt_oyster_demo_test:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev:
      type: fabric
      driver: 'ODBC Driver 18 for SQL Server'
      server: "{{ env_var('DBT_SERVER') }}"
      port: 1433
      database: "{{ env_var('DBT_DATABASE', 'dw_oyster_core') }}"
      schema: 'oystr'
      authentication: 'CLI'
      threads: 4
